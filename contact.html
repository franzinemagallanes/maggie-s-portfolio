
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacts | Tricia Madeja</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="contact-page">

    <!-- Decorative shapes -->
    <div class="contact-decoration top-left"></div>
    <div class="contact-decoration top-right"></div>
    <div class="contact-decoration bottom-left"></div>
    <div class="contact-decoration bottom-right"></div>

    <!-- Main content -->
    <main class="contact-container">

        <!-- Left side -->
        <section class="contact-left">
            <h1>Contacts</h1>
            <p>Press the envelope</p>
        </section>

        <!-- Envelope -->
        <section class="envelope-area">

            <button
                class="envelope-button"
                id="envelopeButton"
                aria-label="Open envelope to reveal contact details"
                aria-expanded="false"
            >
                <div class="envelope" id="envelope">

                    <div class="envelope-back"></div>

                    <div class="contact-details" id="contactDetails">
                        <h2>My Contacts</h2>

                        <p>☎ +123-456-7890</p>
                        <p>☏ @frnzn_</p>
                        <p>📍 Plaridel, Aborlan, Palawan</p>
                    </div>

                    <div class="envelope-front"></div>

                    <div class="envelope-flap"></div>

                </div>
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
